[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visu-predict"
version = "0.1.0"
description = "Transformer-based traffic forecasting toolkit (encoder–decoder, optional GNN, weather + spatial features, transfer learning)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lauro Mota", email = "lauro.mota@almo.co.mz" }]
maintainers = [{ name = "Lauro Mota", email = "lauro.mota@almo.co.mz" }]
keywords = ["traffic-prediction", "transformer", "time-series", "deep-learning", "gnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gnn = ["torch-geometric>=2.4"]
holidays = ["holidays>=0.40"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.7",
]
all = [
    "visu-predict[gnn,holidays,dev]",
]

[project.scripts]
visu-predict = "visu_predict.cli:main"

[project.urls]
Homepage = "https://github.com/almo-intellect/visu-predict"
Issues = "https://github.com/almo-intellect/visu-predict/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visu_predict" = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
