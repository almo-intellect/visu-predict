[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visu-predict"
version = "0.2.0"
description = "Traffic forecasting for road sensor networks: a node-level spatio-temporal Transformer with a reproducible METR-LA / PEMS-BAY benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lauro Mota", email = "lauro.mota@almo.co.mz" }]
maintainers = [{ name = "Lauro Mota", email = "lauro.mota@almo.co.mz" }]
keywords = [
    "traffic-forecasting", "spatio-temporal", "transformer", "time-series",
    "metr-la", "pems-bay", "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "gdown>=5.0",
]

[project.optional-dependencies]
holidays = ["holidays>=0.40"]
legacy = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "pytz",
    "holidays>=0.40",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
all = ["visu-predict[holidays,legacy,dev]"]

[project.scripts]
visu-predict = "visu_predict.cli:main"

[project.urls]
Homepage = "https://github.com/almo-intellect/visu-predict"
Documentation = "https://github.com/almo-intellect/visu-predict#readme"
Changelog = "https://github.com/almo-intellect/visu-predict/blob/main/CHANGELOG.md"
Issues = "https://github.com/almo-intellect/visu-predict/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visu_predict" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
# the V18 package is kept as it was; lint covers the maintained code
extend-exclude = ["src/visu_predict/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# ported verbatim from the V18 smoke test
"tests/test_legacy_smoke.py" = ["E741", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: end-to-end tests that take more than a few seconds"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
